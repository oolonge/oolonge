name: Update language card

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  push:
    paths:
      - scripts/gen_lang_card.py
      - .github/workflows/lang-card.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_lang_card.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/top-langs-*.svg
            git commit -m "[chore] Refresh language card"
            git push
          else
            echo "no changes"
          fi
